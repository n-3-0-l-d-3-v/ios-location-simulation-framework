# EXPERIMENTAL. T11B stage 0: a probe of the toolchain on a hosted macOS runner.
#
# It answers four questions and nothing else: is the Rust target for the
# Apple-silicon iOS Simulator installable; does the existing locsim-ffi crate
# compile for it as a static library; do iOS Simulator runtimes exist on the
# runner and does one device boot; and what do the workspace's Rust tests do
# on macOS.
#
# IT IS NOT ACCEPTANCE EVIDENCE. Nothing here launches an app, compiles
# Swift, or exercises the library on an Apple platform. A green run supports
# no compatibility claim. T11B is not started.
#
# Run by hand only (workflow_dispatch). A standard GitHub-hosted runner, no
# secrets, no third-party actions, read-only token.
name: apple-probe (experimental, T11B stage 0)

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "probe: the toolchain probe. packaging: the XCFramework and Swift consumer experiment"
        type: choice
        options: [packaging, probe, both]
        default: packaging

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IOS_SIM_TARGET: aarch64-apple-ios-sim

jobs:
  probe:
    if: inputs.jobs != 'packaging'
    # The standard Apple-silicon runner. Not a larger runner.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Fetch the commit (plain git; the repository is public)
        id: fetch
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          echo "commit: $(git rev-parse HEAD)"
          echo "requested: ${GITHUB_SHA}"

      - name: Runner and image
        id: runner
        continue-on-error: true
        run: |
          echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
          echo "runner os/arch: ${RUNNER_OS} / ${RUNNER_ARCH}"
          echo "image: ${ImageOS:-unknown} version ${ImageVersion:-unknown}"
          sw_vers
          echo "machine: $(uname -m)"
          echo "cpus: $(sysctl -n hw.ncpu)   memory bytes: $(sysctl -n hw.memsize)"
          df -h / | tail -1

      - name: Xcode
        id: xcode
        continue-on-error: true
        run: |
          xcodebuild -version
          echo "active developer directory: $(xcode-select -p)"
          echo "installed Xcode applications:"
          ls -d /Applications/Xcode*.app

      - name: Rust toolchain as found
        id: rust
        continue-on-error: true
        run: |
          rustc -vV
          cargo -V
          rustup --version 2>/dev/null
          echo "active toolchain:"
          rustup show active-toolchain
          echo "installed targets:"
          rustup target list --installed

      - name: Simulator runtimes, devices and simctl help
        id: discover
        continue-on-error: true
        run: |
          echo "== runtimes"
          xcrun simctl list runtimes
          echo "== available iPhone devices"
          xcrun simctl list devices available | grep -E "^--|iPhone" || true
          echo "== simctl help for boot, bootstatus, launch, location"
          for command in boot bootstatus launch location; do
            echo "-- simctl help ${command}"
            xcrun simctl help "${command}" 2>&1 || true
          done

      - name: Install the Rust target
        id: target
        continue-on-error: true
        timeout-minutes: 10
        run: |
          rustup target add "${IOS_SIM_TARGET}"
          rustup target list --installed

      - name: Build locsim-ffi as a static library for the Simulator target
        id: staticlib
        if: steps.target.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          # The crate's manifest is not changed. This asks for one of the
          # crate types it already declares.
          cargo rustc -p locsim-ffi --target "${IOS_SIM_TARGET}" --crate-type staticlib
          library="target/${IOS_SIM_TARGET}/debug/liblocsim_ffi.a"
          ls -l "${library}"
          echo "== architecture"
          lipo -info "${library}"
          echo "== exported locsim symbols"
          # nm can end with a non-zero status on an archive (the first run of
          # this probe stopped here, after printing all fifteen symbols). Its
          # status is reported, not obeyed: the comparison below is the check.
          { nm -gU "${library}" 2>nm-errors.txt || echo "nm exit status: $?" >&2; } | awk '{print $NF}' | grep '^_locsim_' | sort -u | tee symbols.txt
          echo "nm wrote $(wc -l < nm-errors.txt | tr -d ' ') lines to standard error; the first few:"
          head -5 nm-errors.txt
          echo "count: $(wc -l < symbols.txt | tr -d ' ')   (the header declares 15)"
          echo "== declared in the header"
          grep -oE 'locsim_[a-z_]+\(' crates/locsim-ffi/include/locsim.h | tr -d '(' | sort -u | sed 's/^/_/' > declared.txt
          if diff declared.txt symbols.txt; then echo "symbols equal the header's declarations"; else echo "SYMBOLS DIFFER FROM THE HEADER"; exit 1; fi

      - name: Diagnostic - build every crate type the manifest declares (rlib, cdylib, staticlib)
        id: alltypes
        if: steps.target.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          cargo build -p locsim-ffi --target "${IOS_SIM_TARGET}"
          ls -l "target/${IOS_SIM_TARGET}/debug/" | grep -i locsim_ffi

      - name: Boot one iPhone Simulator
        id: boot
        if: steps.target.outcome == 'success' && steps.staticlib.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          xcrun simctl list devices available -j > devices.json
          # The first available iPhone of the newest iOS 18 runtime, or
          # failing that of any runtime.
          python3 - <<'PY' > chosen.txt
          import json
          data = json.load(open("devices.json"))["devices"]
          def phones(runtime):
              return [d for d in data[runtime] if d.get("isAvailable") and d["name"].startswith("iPhone")]
          runtimes = sorted(r for r in data if "iOS" in r and phones(r))
          preferred = [r for r in runtimes if "iOS-18" in r] or runtimes
          runtime = preferred[-1]
          device = phones(runtime)[0]
          print(device["udid"], runtime, device["name"], sep="|")
          PY
          IFS='|' read -r udid runtime name < chosen.txt
          echo "selected device: ${name}"
          echo "runtime: ${runtime}"
          echo "udid: ${udid}"
          echo "memory before boot:"; vm_stat | head -5
          start=$(date +%s)
          echo "+ xcrun simctl boot ${udid}"
          xcrun simctl boot "${udid}"
          echo "+ xcrun simctl bootstatus ${udid} -b"
          xcrun simctl bootstatus "${udid}" -b
          echo "boot completed after $(( $(date +%s) - start )) s"
          echo "== booted devices"
          xcrun simctl list devices | grep -i booted
          echo "runtime version reported by the device: $(xcrun simctl getenv "${udid}" SIMULATOR_RUNTIME_VERSION)"
          echo "memory after boot:"; vm_stat | head -5
          echo "+ xcrun simctl shutdown ${udid}"
          xcrun simctl shutdown "${udid}"

      - name: Diagnostic - the workspace's Rust tests on the macOS host
        id: hosttests
        continue-on-error: true
        timeout-minutes: 30
        run: |
          # The host target, not the Simulator target. A failure here is a
          # finding about a crate on macOS, not about the Apple FFI build.
          echo "host target: $(rustc -vV | sed -n 's/^host: //p')"
          set +e
          cargo test --workspace --no-fail-fast > hosttests.log 2>&1
          status=$?
          set -e
          grep -E "^(running [0-9]+ tests|test result:|     Running|   Doc-tests)" hosttests.log || true
          echo "== failures, if any"
          grep -E "^(test .* FAILED|failures:|error(\[|:)|---- .* stdout ----)" hosttests.log || echo "none reported"
          awk '/^test result:/ {passed += $4; failed += $6} END {print "total passed=" passed " failed=" failed}' hosttests.log
          if [ "${status}" -ne 0 ]; then
            echo "== last 120 lines of the log"
            tail -120 hosttests.log
          fi
          exit "${status}"

      - name: Summary
        if: always()
        env:
          FETCH: ${{ steps.fetch.outcome }}
          RUNNER_INFO: ${{ steps.runner.outcome }}
          XCODE: ${{ steps.xcode.outcome }}
          RUST: ${{ steps.rust.outcome }}
          DISCOVER: ${{ steps.discover.outcome }}
          TARGET: ${{ steps.target.outcome }}
          STATICLIB: ${{ steps.staticlib.outcome }}
          ALLTYPES: ${{ steps.alltypes.outcome }}
          BOOT: ${{ steps.boot.outcome }}
          HOSTTESTS: ${{ steps.hosttests.outcome }}
        run: |
          {
            echo "PROBE SUMMARY (experimental; not acceptance evidence)"
            echo "commit=${GITHUB_SHA}"
            echo "image=${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "step.fetch_commit=${FETCH}"
            echo "step.runner_info=${RUNNER_INFO}"
            echo "step.xcode_info=${XCODE}"
            echo "step.rust_info=${RUST}"
            echo "step.simulator_discovery=${DISCOVER}"
            echo "step.rust_target_install=${TARGET}"
            echo "step.staticlib_build_ios_sim=${STATICLIB}"
            echo "step.all_crate_types_build_ios_sim=${ALLTYPES}"
            echo "step.simulator_boot=${BOOT}"
            echo "step.macos_host_workspace_tests=${HOSTTESTS}"
            echo "unverified=swift_compilation,linking_into_an_app,app_launch,library_execution_on_ios,core_location,gpx"
          } | tee summary.txt
          {
            echo '```'
            cat summary.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          # The run is red if any probed step failed, so that its status is
          # not mistaken for a pass. Read the lines above for which.
          if grep -q "=failure" summary.txt; then exit 1; fi

  # EXPERIMENTAL. T11B readiness, experiment A: can the existing C interface
  # be packaged as an XCFramework and consumed by a Swift test target that
  # runs in an iOS Simulator.
  #
  # IT IS NOT ACCEPTANCE EVIDENCE FOR T11B. The consumer is a fixture, not
  # the Swift adapter; no app is built or launched; nothing touches Core
  # Location. Compiling, linking, running and being correct are reported as
  # four separate things.
  packaging:
    if: inputs.jobs != 'probe'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # The baseline is pinned, so that a new runner image cannot change it
      # silently. A missing version is a failure, not a fallback.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      RUSTUP_TOOLCHAIN: "1.98.1"
      SIM_DEVICE: iPhone 16 Pro
      SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-6
    steps:
      - name: Fetch the commit (plain git; the repository is public)
        id: fetch
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          echo "commit: $(git rev-parse HEAD)"
          echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
          echo "image: ${ImageOS:-unknown} version ${ImageVersion:-unknown}"
          sw_vers
          echo "untracked or generated files after checkout (none expected):"
          git status --porcelain --ignored

      - name: Pinned toolchain
        id: toolchain
        timeout-minutes: 10
        run: |
          xcodebuild -version
          rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal
          rustup target add "${IOS_SIM_TARGET}"
          rustc -vV
          cargo -V
          swift --version

      - name: "Negative 1 - a clean checkout, before anything is generated, must not build"
        id: negative_clean
        continue-on-error: true
        timeout-minutes: 10
        run: |
          test ! -e Apple/PackagingProbe/Artifacts
          Scripts/apple/expect-build-failure.sh "clean checkout, nothing generated" "${RUNNER_TEMP}/derived"

      - name: Build the static library and package the XCFramework
        id: package
        timeout-minutes: 20
        run: Scripts/apple/build-xcframework.sh

      - name: Symbols of the packaged library against the header, and what nm says
        id: symbols
        continue-on-error: true
        timeout-minutes: 15
        run: |
          inspect() {
            library="$1"
            echo "=================== ${library}"
            { nm -gU "${library}" 2>nm-errors.txt || echo "nm exit status: $?" >&2; } | awk '{print $NF}' | grep '^_locsim_' | sort -u > symbols.txt
            echo "exported locsim symbols: $(wc -l < symbols.txt | tr -d ' ')   (the header declares $(wc -l < declared.txt | tr -d ' '))"
            if diff declared.txt symbols.txt; then echo "symbols equal the declarations of the header"; else echo "SYMBOLS DIFFER FROM THE HEADER"; differs=1; fi
            echo "-- nm wrote $(wc -l < nm-errors.txt | tr -d ' ') lines to standard error"
            echo "-- its messages, by kind"
            sed -E 's/^.*\): //' nm-errors.txt | sort | uniq -c
            echo "-- the archive members they name, by crate"
            sed -nE 's/^.*\.a\(([^)]*)\).*$/\1/p' nm-errors.txt | sed -E 's/-[0-9a-f]{16}\..*$//' | sort | uniq -c
            echo "-- members of the crates of this project among them: $(grep -c 'locsim' nm-errors.txt || true)"
            echo "-- the same listing with the bitcode reader of nm off (--no-llvm-bc)"
            set +e
            nm --no-llvm-bc -gU "${library}" > nm-nobc.txt 2> nm-nobc-errors.txt
            echo "exit status $?; lines on standard error: $(wc -l < nm-nobc-errors.txt | tr -d ' ')"
            head -3 nm-nobc-errors.txt
            awk '{print $NF}' nm-nobc.txt | grep '^_locsim_' | sort -u | diff declared.txt - && echo "symbols equal the declarations of the header"
            set -e
            echo "-- one member nm complained about, as Mach-O"
            rm -rf members && mkdir members
            (
              cd members
              ar -x "${library}" 2>/dev/null || true
              member="$(sed -nE 's/^.*\.a\(([^)]*)\).*$/\1/p' ../nm-errors.txt | head -1)"
              if [ -n "${member}" ] && [ -f "${member}" ]; then
                echo "member: ${member}"
                file "${member}"
                otool -l "${member}" | grep -E "segname|sectname" | paste - - | sort | uniq -c
              else
                echo "none to show"
              fi
              echo "-- build version of one member of locsim_ffi"
              own="$(ls | grep -E '^locsim_ffi.*\.o$' | head -1)"
              if [ -n "${own}" ]; then otool -l "${own}" | grep -A5 LC_BUILD_VERSION || echo "no LC_BUILD_VERSION"; fi
            )
          }
          differs=0
          grep -oE 'locsim_[a-z_]+\(' crates/locsim-ffi/include/locsim.h | tr -d '(' | sort -u | sed 's/^/_/' > declared.txt
          inspect "$(find "${PWD}/Apple/PackagingProbe/Artifacts" -name liblocsim_ffi.a)"
          echo "== for comparison, a debug build (what the toolchain probe built)"
          cargo rustc -q -p locsim-ffi --target "${IOS_SIM_TARGET}" --crate-type staticlib
          inspect "${PWD}/target/${IOS_SIM_TARGET}/debug/liblocsim_ffi.a"
          exit "${differs}"

      - name: Boot the baseline Simulator
        id: boot
        timeout-minutes: 15
        run: |
          xcrun simctl list devices available -j > devices.json
          python3 - <<'PY' > udid.txt
          import json, os, sys
          devices = json.load(open("devices.json"))["devices"].get(os.environ["SIM_RUNTIME"], [])
          found = [d["udid"] for d in devices if d.get("isAvailable") and d["name"] == os.environ["SIM_DEVICE"]]
          if not found:
              sys.exit("the baseline device is not on this runner")
          print(found[0])
          PY
          udid="$(cat udid.txt)"
          echo "SIM_UDID=${udid}" >> "${GITHUB_ENV}"
          echo "device: ${SIM_DEVICE}   runtime: ${SIM_RUNTIME}   udid: ${udid}"
          xcrun simctl boot "${udid}"
          xcrun simctl bootstatus "${udid}" -b
          echo "runtime version reported by the device: $(xcrun simctl getenv "${udid}" SIMULATOR_RUNTIME_VERSION)"

      - name: "Stage 1 and 2 - compile the Swift consumer and link it with the packaged library"
        id: build
        timeout-minutes: 20
        working-directory: Apple/PackagingProbe
        run: |
          xcodebuild -list
          set +e
          xcodebuild build-for-testing \
            -scheme LocsimPackagingProbe \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -derivedDataPath "${RUNNER_TEMP}/derived" > "${RUNNER_TEMP}/build.log" 2>&1
          status=$?
          set -e
          echo "::group::the whole build log"
          cat "${RUNNER_TEMP}/build.log"
          echo "::endgroup::"
          echo "== xcodebuild build-for-testing exit status ${status}"
          echo "== Swift compile steps: $(grep -cE '^(SwiftCompile|SwiftDriver|CompileSwift)' "${RUNNER_TEMP}/build.log")"
          echo "== link steps:"
          grep -E '^Ld ' "${RUNNER_TEMP}/build.log" | cut -c1-300
          echo "== how the link commands name the library:"
          grep -E 'clang.*(locsim_ffi|LocsimFFI)' "${RUNNER_TEMP}/build.log" | grep -oE '(-l[A-Za-z_]*locsim[A-Za-z_]*|[^ ]*liblocsim_ffi\.a|-L[^ ]*LocsimFFI[^ ]*)' | sort | uniq -c
          echo "== every warning and error, de-duplicated:"
          grep -E '(warning|error):' "${RUNNER_TEMP}/build.log" | cut -c1-400 | sort | uniq -c || echo "none"
          echo "== linker diagnostics: $(grep -cE '^ld: ' "${RUNNER_TEMP}/build.log")"
          exit "${status}"

      - name: "Stage 3 and 4 - run the tests in the Simulator, and what they assert"
        id: test
        timeout-minutes: 20
        working-directory: Apple/PackagingProbe
        run: |
          set +e
          xcodebuild test-without-building \
            -scheme LocsimPackagingProbe \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -derivedDataPath "${RUNNER_TEMP}/derived" > "${RUNNER_TEMP}/test.log" 2>&1
          status=$?
          set -e
          echo "::group::the whole test log"
          cat "${RUNNER_TEMP}/test.log"
          echo "::endgroup::"
          echo "== xcodebuild test-without-building exit status ${status}"
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ tests|\*\* TEST" "${RUNNER_TEMP}/test.log" || true
          echo "== where the tests say they ran:"
          grep "LOCSIM-PROBE" "${RUNNER_TEMP}/test.log" || echo "the line was not found in the log (the tests still assert the environment)"
          if [ "${status}" -eq 0 ] && ! grep -q "Executed 4 tests, with 0 failures" "${RUNNER_TEMP}/test.log"; then
            echo "xcodebuild succeeded but four passing tests are not in the log"
            exit 1
          fi
          exit "${status}"

      - name: "Negative 2 - a damaged library must not build, with the earlier build products still present"
        id: negative_damaged
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          library="$(find Apple/PackagingProbe/Artifacts -name liblocsim_ffi.a)"
          printf 'this is not an archive\n' > "${library}"
          ls -l "${library}"
          Scripts/apple/expect-build-failure.sh "library replaced by 23 bytes of text" "${RUNNER_TEMP}/derived"

      - name: "Negative 3 - a removed XCFramework must not build, with the earlier build products still present"
        id: negative_removed
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          rm -rf Apple/PackagingProbe/Artifacts/LocsimFFI.xcframework
          Scripts/apple/expect-build-failure.sh "XCFramework removed" "${RUNNER_TEMP}/derived"

      - name: After regeneration the tests pass again
        id: regenerated
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          Scripts/apple/build-xcframework.sh > "${RUNNER_TEMP}/repackage.log" 2>&1 || { cat "${RUNNER_TEMP}/repackage.log"; exit 1; }
          tail -3 "${RUNNER_TEMP}/repackage.log"
          cd Apple/PackagingProbe
          set +e
          xcodebuild test \
            -scheme LocsimPackagingProbe \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -derivedDataPath "${RUNNER_TEMP}/derived" > "${RUNNER_TEMP}/retest.log" 2>&1
          status=$?
          set -e
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ tests|\*\* TEST|error:" "${RUNNER_TEMP}/retest.log" | cut -c1-300 || true
          echo "== xcodebuild test exit status ${status}"
          exit "${status}"

      - name: Shut the Simulator down
        if: always() && env.SIM_UDID != ''
        continue-on-error: true
        run: xcrun simctl shutdown "${SIM_UDID}"

      - name: Summary
        if: always()
        env:
          FETCH: ${{ steps.fetch.outcome }}
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          NEGATIVE_CLEAN: ${{ steps.negative_clean.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          SYMBOLS: ${{ steps.symbols.outcome }}
          BOOT: ${{ steps.boot.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
          NEGATIVE_DAMAGED: ${{ steps.negative_damaged.outcome }}
          NEGATIVE_REMOVED: ${{ steps.negative_removed.outcome }}
          REGENERATED: ${{ steps.regenerated.outcome }}
        run: |
          {
            echo "PACKAGING SUMMARY (experimental; not acceptance evidence for T11B)"
            echo "commit=${GITHUB_SHA}"
            echo "image=${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "pinned.xcode=${DEVELOPER_DIR}"
            echo "pinned.rust=${RUSTUP_TOOLCHAIN}"
            echo "pinned.simulator=${SIM_DEVICE} / ${SIM_RUNTIME}"
            echo "step.fetch_commit=${FETCH}"
            echo "step.pinned_toolchain=${TOOLCHAIN}"
            echo "step.negative_clean_checkout_does_not_build=${NEGATIVE_CLEAN}"
            echo "step.staticlib_and_xcframework=${PACKAGE}"
            echo "step.symbols_equal_header=${SYMBOLS}"
            echo "step.simulator_boot=${BOOT}"
            echo "step.swift_compile_and_link=${BUILD}"
            echo "step.tests_run_in_simulator_and_pass=${TEST}"
            echo "step.negative_damaged_library_does_not_build=${NEGATIVE_DAMAGED}"
            echo "step.negative_removed_xcframework_does_not_build=${NEGATIVE_REMOVED}"
            echo "step.tests_pass_after_regeneration=${REGENERATED}"
            echo "unverified=swift_adapter,app_build,app_launch,core_location,gpx,device_target,physical_device"
          } | tee summary.txt
          {
            echo '```'
            cat summary.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          if grep -qE "=(failure|skipped|cancelled)" summary.txt; then exit 1; fi
